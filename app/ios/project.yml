name: MuDoPhone
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  MuDo:
    path: ..
targets:
  MuDoPhone:
    type: application
    platform: iOS
    sources: [MuDoPhone]
    dependencies:
      - package: MuDo
        product: MuDoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.steve.MuDoPhone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MuDoPhone/Info.plist
      properties:
        CFBundleDisplayName: MuDo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: MuDo connects to mudod on your servers to show agent sessions.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.steve.MuDoPhone.add
            CFBundleURLSchemes: [mudo]
