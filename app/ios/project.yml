name: MuDoPhone
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  MuDo:
    path: ..
targets:
  MuDoPhone:
    type: application
    platform: iOS
    sources: [MuDoPhone, Shared]
    dependencies:
      - package: MuDo
        product: MuDoCore
      - target: MuDoWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.steve.MuDoPhone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: MuDoPhone/MuDoPhone.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)dev.steve.MuDoPhone.shared]
    info:
      path: MuDoPhone/Info.plist
      properties:
        CFBundleDisplayName: MuDo
        MuDoSharedKeychainGroup: $(AppIdentifierPrefix)dev.steve.MuDoPhone.shared
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: MuDo connects to mudod on your servers to show agent sessions.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.steve.MuDoPhone.add
            CFBundleURLSchemes: [mudo]
  MuDoWidget:
    type: app-extension
    platform: iOS
    sources: [MuDoWidget, Shared]
    dependencies:
      - package: MuDo
        product: MuDoCore
    entitlements:
      path: MuDoWidget/MuDoWidget.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)dev.steve.MuDoPhone.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.steve.MuDoPhone.Widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: MuDoWidget/Info.plist
      properties:
        CFBundleDisplayName: MuDo
        MuDoSharedKeychainGroup: $(AppIdentifierPrefix)dev.steve.MuDoPhone.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
