name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  mudod:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: make -C server test build
      - uses: actions/upload-artifact@v7
        with:
          name: mudod
          path: server/dist/mudod-*

  app:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - run: make -C server app-resource
      - run: make -C app test app SIGN_ID=-
      - name: Zip MuDo.app
        run: ditto -c -k --keepParent app/build/MuDo.app MuDo-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: MuDo-macos-arm64.zip

  publish:
    needs: [release-please, mudod, app]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and upload
        working-directory: assets
        run: |
          sha256sum mudod-* MuDo-macos-arm64.zip > checksums.txt
          gh release upload "$TAG" mudod-* MuDo-macos-arm64.zip checksums.txt --clobber --repo "$GITHUB_REPOSITORY"
