name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  mudod:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: make -C server test build
      - uses: actions/upload-artifact@v7
        with:
          name: mudod
          path: server/dist/mudod-*

  app:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - run: make -C server app-resource
      # Sign with the stable self-signed "MuDo Dev" identity so macOS keeps the app's
      # permissions (Automation, Accessibility) across updates. Ad-hoc when the secrets are unset.
      - name: Import signing identity
        env:
          P12: ${{ secrets.MUDO_SIGN_P12 }}
          P12_PASS: ${{ secrets.MUDO_SIGN_P12_PASS }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASS" ]; then
            echo "::warning::MUDO_SIGN_P12 is not set: MuDo.app is signed ad-hoc"
            echo "SIGN_ID=-" >> "$GITHUB_ENV"
            exit 0
          fi
          kc="$RUNNER_TEMP/mudo-signing.keychain-db"
          kpass="$(openssl rand -hex 24)"
          security create-keychain -p "$kpass" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$kpass" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASS" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | xargs)
          echo "SIGN_ID=MuDo Dev" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - run: make -C app test app SIGN_ID="$SIGN_ID" SIGN_KEYCHAIN="$SIGN_KEYCHAIN"
      - name: Show signature
        run: codesign -dr - app/build/MuDo.app
      - name: Zip MuDo.app
        run: ditto -c -k --keepParent app/build/MuDo.app MuDo-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: MuDo-macos-arm64.zip

  publish:
    needs: [release-please, mudod, app]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and upload
        working-directory: assets
        run: |
          sha256sum mudod-* MuDo-macos-arm64.zip > checksums.txt
          gh release upload "$TAG" mudod-* MuDo-macos-arm64.zip checksums.txt --clobber --repo "$GITHUB_REPOSITORY"

  # Updates Casks/mudo.rb in <owner>/homebrew-tap. Needs the HOMEBREW_TAP_TOKEN secret: a
  # fine-grained token with Contents read/write on that repository only.
  homebrew:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - if: env.TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask was not updated"
      - if: env.TAP_TOKEN != ''
        uses: actions/checkout@v7
        with:
          path: mudo
          sparse-checkout: packaging/homebrew
      - if: env.TAP_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: app
          path: assets
      - if: env.TAP_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - if: env.TAP_TOKEN != ''
        name: Update Casks/mudo.rb
        run: |
          version="${TAG#v}"
          sha=$(sha256sum assets/MuDo-macos-arm64.zip | cut -d' ' -f1)
          mkdir -p tap/Casks
          sed -e "s/^  version \".*\"/  version \"$version\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" \
              mudo/packaging/homebrew/mudo.rb > tap/Casks/mudo.rb
          grep -q "version \"$version\"" tap/Casks/mudo.rb && grep -q "sha256 \"$sha\"" tap/Casks/mudo.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mudo.rb
          git diff --cached --quiet && exit 0
          git commit -m "mudo $version"
          git push
